<template>
    <div class={computedContainerClass}>
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-brand-badge">
                    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                    <span>Workspace HQ</span>
                </div>
                <h1 class="auth-title">Join the Resistance (or just our app).</h1>
                <p class="auth-subtitle">Create your account in 30 seconds before robots learn how to make espresso.</p>
            </div>

            <!-- Error Banner -->
            <template lwc:if={errorMessage}>
                <div class="auth-error-banner" role="alert">
                    <svg class="error-icon" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                    </svg>
                    <span>{errorMessage}</span>
                </div>
            </template>

            <!-- Signup Form -->
            <form onsubmit={handleSignupSubmit} class="auth-form">
                <!-- Full Name -->
                <div class="form-group">
                    <label class="form-label" for="signup-name">What should we call you?</label>
                    <div class="input-wrapper">
                        <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                        </svg>
                        <input
                            id="signup-name"
                            type="text"
                            class="form-input"
                            placeholder="e.g. Master of Break Fixes"
                            value={name}
                            oninput={handleNameChange}
                            required
                        />
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label class="form-label" for="signup-email">Work Email</label>
                    <div class="input-wrapper">
                        <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
                        </svg>
                        <input
                            id="signup-email"
                            type="email"
                            class="form-input"
                            placeholder="you@company.com (no spam, we promise)"
                            value={email}
                            oninput={handleEmailChange}
                            required
                            autocomplete="email"
                        />
                    </div>
                </div>

                <!-- Password and Confirm Password Row -->
                <div class="form-row">
                    <div class="form-group form-col">
                        <label class="form-label" for="signup-password">Password</label>
                        <div class="input-wrapper">
                            <input
                                id="signup-password"
                                type={passwordInputType}
                                class="form-input"
                                placeholder="Min 6 characters"
                                value={password}
                                oninput={handlePasswordChange}
                                required
                            />
                        </div>
                    </div>
                    <div class="form-group form-col">
                        <label class="form-label" for="signup-confirm-password">Confirm Password</label>
                        <div class="input-wrapper">
                            <input
                                id="signup-confirm-password"
                                type={passwordInputType}
                                class="form-input"
                                placeholder="Type it again with confidence"
                                value={confirmPassword}
                                oninput={handleConfirmPasswordChange}
                                required
                            />
                        </div>
                    </div>
                </div>

                <!-- Password visibility toggle checkbox -->
                <div class="form-checkbox-row">
                    <input type="checkbox" id="show-passwords" checked={showPassword} onchange={togglePasswordVisibility} />
                    <label for="show-passwords" class="checkbox-label">Show passwords (no peekers around)</label>
                </div>

                <!-- Avatar Selection -->
                <div class="form-group">
                    <label class="form-label">Pick your avatar vibe</label>
                    <div class="avatar-selection-grid">
                        <template for:each={avatarOptions} for:item="opt">
                            <button
                                key={opt.name}
                                type="button"
                                class={opt.cssClass}
                                data-avatar={opt.name}
                                onclick={handleSelectAvatar}
                                title={opt.label}
                            >
                                <lightning-icon icon-name={opt.name} size="small" variant="inverse"></lightning-icon>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- Bio -->
                <div class="form-group">
                    <label class="form-label" for="signup-bio">Your secret superpower (Optional)</label>
                    <input
                        id="signup-bio"
                        type="text"
                        class="form-input bio-input"
                        placeholder="e.g. Turning complex problems into working software"
                        value={bio}
                        oninput={handleBioChange}
                        maxlength="200"
                    />
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn" disabled={isLoading}>
                    <template lwc:if={isLoading}>
                        <span class="spinner"></span>
                        <span>Forging your profile...</span>
                    </template>
                    <template lwc:else>
                        <span>Create My Account</span>
                        <svg class="arrow-icon" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </template>
                </button>
            </form>

            <!-- Social Authentication Divider -->
            <div class="auth-divider-line">
                <span>OR TAKE THE FAST TRACK</span>
            </div>

            <!-- Google Sign Up Button -->
            <button 
                type="button" 
                class="google-auth-btn" 
                onclick={handleGoogleSignUp} 
                disabled={isLoading}>
                <svg class="google-icon-svg" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Sign up with Google (the fast way)</span>
            </button>

            <!-- Footer Switcher -->
            <div class="auth-footer">
                <span>Already registered?</span>
                <button type="button" class="switch-link-btn" onclick={handleSwitchToLogin}>Just Sign In</button>
            </div>
        </div>
    </div>
</template>
